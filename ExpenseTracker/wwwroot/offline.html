<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brak połączenia - Expense Tracker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: #0f1419;
            color: #e2e8f0;
        }

        .offline-card {
            max-width: 380px;
            width: 100%;
            background-color: #182028;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 28px 24px;
            text-align: center;
        }

        .offline-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px auto;
            border-radius: 12px;
            background-color: #212b36;
            color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.45;
            margin: 0 0 22px 0;
        }

        button {
            width: 100%;
            min-height: 44px;
            border: none;
            border-radius: 8px;
            background-color: #28a745;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-badge">!</div>
        <h1>Brak połączenia z serwerem</h1>
        <p>Sprawdź połączenie z internetem lub upewnij się, że serwer aplikacji jest uruchomiony.</p>
        <button type="button" onclick="window.location.reload()">Spróbuj ponownie</button>
    </div>
</body>
</html>
